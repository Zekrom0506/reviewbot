# ElasticMQ: a free local stand-in for Amazon SQS.
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  reviewbot-jobs-dlq {}

  reviewbot-jobs {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "reviewbot-jobs-dlq"
      maxReceiveCount = 3
    }
  }
}
